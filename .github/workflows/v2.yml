name: V2 isolated acceptance
on:
  push:
    branches: [feature/recommender-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.16'
      - run: pip install -r requirements-v2-test.txt
      - run: python -m pytest tests/v2 -q --junitxml=test-results/v2.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-acceptance-results
          path: test-results/v2.xml
  docker-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.v2-test -t bustag-v2-test .
      - run: docker run --rm --network none bustag-v2-test
  legacy-runtime-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.v2-legacy-test -t bustag-v2-legacy-test .
      - run: docker run --rm --network none bustag-v2-legacy-test
